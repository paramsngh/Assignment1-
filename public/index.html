<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
 
    <h1> TMU Event Planner </h1>
    <p> Want to set up or register for school-wide events? Use the TMU 
      Event Planner! Select from the options below!
    </p>

    <div class="options-box">

      <div class="planner-box">
        <h2> Interested in Running an Event? </h2>
        <p> Click on the button below!</p>
        <form action="create.html" method="get">
          <button type="submit"> Create Now</button>
        </form>
      </div>

      <div class="register-box">
        <h2> Want to Take a Look at the Current Events? </h2>
        <p> Click on the button below!</p>
        <form action="create.html" method="get">
          <button type="submit"> View Now </button>
        </form>
      </div>

    </div>


</body>
